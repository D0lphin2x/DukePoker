name: Sync Duke Poker Instagram events

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-event-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.INSTAGRAM_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_GRAPH_VERSION: v27.0
      DEPLOY_VERIFY_TIMEOUT_SECONDS: "900"
    steps:
      - name: Check out the current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Instagram event posts
        id: sync
        run: python duke-poker-website/scripts/sync_instagram_events.py

      - name: Commit Instagram checkpoint and event data
        if: steps.sync.outputs.state_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Duke Poker Instagram events"
          git push

      - name: Verify the live announcement
        if: steps.sync.outputs.event_published == 'true'
        run: python duke-poker-website/scripts/verify_live_announcement.py
